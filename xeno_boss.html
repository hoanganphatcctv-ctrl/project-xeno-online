<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xeno Monsters Roaming - Dark Bio-Mecha Eldritch Canvas 2D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #02040a;
            font-family: 'Inter', 'JetBrains Mono', 'Consolas', monospace;
            color: #94a3b8;
            user-select: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background-color: #02040a;
            background-image: 
                radial-gradient(circle at 50% 50%, #0b1120 0%, #02040a 100%),
                linear-gradient(to right, rgba(244, 63, 94, 0.035) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(56, 189, 248, 0.035) 1px, transparent 1px);
            background-size: 100% 100%, 44px 44px, 44px 44px;
        }
        #hudBar {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: rgba(9, 13, 26, 0.88);
            border: 1px solid rgba(244, 63, 94, 0.35);
            border-radius: 9999px;
            font-size: 12px;
            color: #e2e8f0;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.65);
            z-index: 20;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 96vw;
        }
        .hud-btn {
            background: rgba(30, 41, 59, 0.85);
            color: #cbd5e1;
            border: 1px solid rgba(148, 163, 184, 0.3);
            border-radius: 9999px;
            padding: 4px 11px;
            font-size: 11px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.18s ease;
        }
        .hud-btn:hover, .hud-btn.active {
            background: rgba(225, 29, 72, 0.28);
            color: #fda4af;
            border-color: #f43f5e;
            box-shadow: 0 0 12px rgba(244, 63, 94, 0.35);
        }
        #miniTip {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            padding: 6px 16px;
            background: rgba(9, 13, 26, 0.88);
            border: 1px solid rgba(56, 189, 248, 0.32);
            border-radius: 9999px;
            font-size: 11px;
            color: #38bdf8;
            pointer-events: none;
            backdrop-filter: blur(4px);
            letter-spacing: 0.4px;
            white-space: nowrap;
            max-width: 95vw;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>

    <div id="hudBar">
        <span style="color:#f43f5e;font-weight:700;letter-spacing:0.6px;">BIO-MECHA HORROR CODEX</span>
        <button id="btnTogglePause" class="hud-btn" type="button">Tạm dừng (Space)</button>
        <button id="btnToggleFreeze" class="hud-btn" type="button">Đóng băng Cryo</button>
        <button id="btnToggleBurn" class="hud-btn" type="button">Thiêu đốt Napalm</button>
        <button id="btnToggleCast" class="hud-btn" type="button">Kích hoạt Cuồng Nộ</button>
        <button id="btnGridShowcase" class="hud-btn" type="button">Xếp đội hình / Chạy tự do</button>
    </div>

    <canvas id="canvas"></canvas>
    <div id="miniTip">Chuột di/nhấp: Quái né & nổi giận | Space: Tạm dừng | 10 Boss Cuối Màn (Map 1 -> Map 10)</div>

    <script>
    // =========================================================================
    // PHẦN 1: CÁC HÀM TRỢ GIÚP CANVAS 2D & BỘ ĐỆM GRADIENT VECTOR
    // =========================================================================
    let frameCounter = 0;
    let globalFrozenState = false;
    let globalBurnState = false;
    let globalRageCast = false;
    let showcaseGridMode = false;
    const _radialGradCache = new Map();
    const _linearGradCache = new Map();

    function safeArc(c, x, y, r, sAng = 0, eAng = Math.PI * 2, ccw = false) {
        if (!Number.isFinite(x) || !Number.isFinite(y)) return;
        const rad = Number.isFinite(r) ? Math.max(0.5, r) : 1;
        c.arc(x, y, rad, sAng, eAng, ccw);
    }

    function safeRadialGradient(c, x0, y0, r0, x1, y1, r1) {
        const rx0 = Number.isFinite(x0) ? x0 : 0;
        const ry0 = Number.isFinite(y0) ? y0 : 0;
        const rr0 = Number.isFinite(r0) ? Math.max(0.01, r0) : 0.01;
        const rx1 = Number.isFinite(x1) ? x1 : 0;
        const ry1 = Number.isFinite(y1) ? y1 : 0;
        const rr1 = Number.isFinite(r1) ? Math.max(rr0 + 0.1, r1) : 10;
        try {
            return c.createRadialGradient(rx0, ry0, rr0, rx1, ry1, rr1);
        } catch (e) {
            return c.createRadialGradient(0, 0, 0.1, 0, 0, 10);
        }
    }

    function getCachedRadialGradient(c, key, x0, y0, r0, x1, y1, r1, stops) {
        let g = _radialGradCache.get(key);
        if (!g) {
            g = safeRadialGradient(c, x0, y0, r0, x1, y1, r1);
            for (let i = 0; i < stops.length; i++) {
                g.addColorStop(stops[i][0], stops[i][1]);
            }
            if (_radialGradCache.size > 400) _radialGradCache.clear();
            _radialGradCache.set(key, g);
        }
        return g;
    }

    function getCachedLinearGradient(c, key, x0, y0, x1, y1, stops) {
        let g = _linearGradCache.get(key);
        if (!g) {
            g = c.createLinearGradient(x0, y0, x1, y1);
            for (let i = 0; i < stops.length; i++) {
                g.addColorStop(stops[i][0], stops[i][1]);
            }
            if (_linearGradCache.size > 400) _linearGradCache.clear();
            _linearGradCache.set(key, g);
        }
        return g;
    }

    // Vẽ con mắt ác quỷ / cảm biến quang học cơ khí (Bio-Mecha Eldritch Ocular Sensor)
    function drawEldritchMechaEye(c, x, y, rad, irisCol, pupilSlit = true, rot = 0) {
        c.save();
        c.translate(x, y);
        if (rot) c.rotate(rot);

        const g = safeRadialGradient(c, 0, 0, rad * 0.1, 0, 0, rad * 1.45);
        g.addColorStop(0, "#ffffff");
        g.addColorStop(0.35, irisCol);
        g.addColorStop(0.85, "rgba(0,0,0,0.85)");
        g.addColorStop(1, "rgba(0,0,0,0)");
        c.fillStyle = g;
        c.beginPath();
        safeArc(c, 0, 0, rad * 1.35);
        c.fill();

        c.fillStyle = irisCol;
        c.beginPath();
        c.moveTo(-rad, 0);
        c.bezierCurveTo(-rad * 0.5, -rad * 0.95, rad * 0.5, -rad * 0.95, rad, 0);
        c.bezierCurveTo(rad * 0.5, rad * 0.95, -rad * 0.5, rad * 0.95, -rad, 0);
        c.closePath();
        c.fill();

        if (pupilSlit) {
            c.fillStyle = "#020617";
            c.beginPath();
            c.moveTo(0, -rad * 0.78);
            c.bezierCurveTo(rad * 0.28, -rad * 0.25, rad * 0.28, rad * 0.25, 0, rad * 0.78);
            c.bezierCurveTo(-rad * 0.28, rad * 0.25, -rad * 0.28, -rad * 0.25, 0, -rad * 0.78);
            c.closePath();
            c.fill();
        }

        c.fillStyle = "#ffffff";
        c.beginPath();
        safeArc(c, rad * 0.28, -rad * 0.24, Math.max(0.6, rad * 0.26));
        c.fill();
        c.restore();
    }

    // Vẽ khung xương sườn cơ khí lộ thiên & khe tản nhiệt năng lượng
    function drawExposedMechaRibcage(c, startX, endX, maxWidth, count, ribCol, glowCol, pulse = 1) {
        const step = (startX - endX) / Math.max(1, count);
        for (let i = 0; i < count; i++) {
            const rx = startX - i * step;
            const t = i / Math.max(1, count - 1);
            const w = maxWidth * (1 - t * 0.35) * pulse;

            c.strokeStyle = glowCol;
            c.lineWidth = 2.2;
            c.beginPath();
            c.moveTo(rx + step * 0.15, -w * 0.82);
            c.bezierCurveTo(rx - step * 0.25, -w * 0.45, rx - step * 0.25, w * 0.45, rx + step * 0.15, w * 0.82);
            c.stroke();

            c.fillStyle = ribCol;
            for (let side = -1; side <= 1; side += 2) {
                c.beginPath();
                c.moveTo(rx + step * 0.22, side * w * 0.14);
                c.bezierCurveTo(
                    rx + step * 0.08, side * w * 0.65,
                    rx - step * 0.25, side * w * 0.92,
                    rx - step * 0.45, side * w * 1.08
                );
                c.bezierCurveTo(
                    rx - step * 0.32, side * w * 0.55,
                    rx - step * 0.12, side * w * 0.30,
                    rx - step * 0.16, side * w * 0.14
                );
                c.closePath();
                c.fill();
            }
        }
    }

    // =========================================================================
    // PHẦN 2: BỘ PHẬN GIẢI PHẪU DÙNG CHUNG CỦA 10 BOSS (DARK BIO-MECHA ELDRITCH)
    // =========================================================================
    function drawBossSpikedMorningStarTail(e, cfg) {
        const r = e.radius;
        const isCasting = (e.skillState && e.skillState !== "idle") || globalRageCast;
        const swingSpeed = isCasting ? 1.65 : 0.92;
        const swingAmp = isCasting ? (r * 0.58) : (r * 0.40);
        const wag = Math.sin(e.legPhase * swingSpeed) * swingAmp;

        if (cfg.hasTwinWhips) {
            for (let tSide = -1; tSide <= 1; tSide += 2) {
                const wWag = Math.sin(e.legPhase * 1.15 + (tSide === 1 ? 0.5 : 2.3)) * (r * 0.38);
                const cp1X = -r * 0.95, cp1Y = tSide * r * 0.86 + wWag * 0.35;
                const cp2X = -r * 1.52, cp2Y = tSide * r * 0.22 - wWag * 0.55;
                const eX = -r * 2.04, eY = tSide * r * 0.64 + wWag;

                ctx.strokeStyle = cfg.darkArmor;
                ctx.lineWidth = Math.max(5.0, r * 0.14);
                ctx.lineCap = "round";
                ctx.beginPath();
                ctx.moveTo(-r * 0.62, tSide * r * 0.34);
                ctx.bezierCurveTo(cp1X, cp1Y, cp2X, cp2Y, eX, eY);
                ctx.stroke();

                ctx.strokeStyle = cfg.veinCol;
                ctx.lineWidth = 1.9;
                ctx.setLineDash([5, 4]);
                ctx.beginPath();
                ctx.moveTo(-r * 0.62, tSide * r * 0.34);
                ctx.bezierCurveTo(cp1X, cp1Y, cp2X, cp2Y, eX, eY);
                ctx.stroke();
                ctx.setLineDash([]);

                ctx.fillStyle = cfg.spikeCol;
                for (let b = 1; b <= 3; b++) {
                    const bt = b * 0.25;
                    const mt = 1 - bt;
                    const bx = mt*mt*mt*(-r*0.62) + 3*mt*mt*bt*cp1X + 3*mt*bt*bt*cp2X + bt*bt*bt*eX;
                    const by = mt*mt*mt*(tSide*r*0.34) + 3*mt*mt*bt*cp1Y + 3*mt*bt*bt*cp2Y + bt*bt*bt*eY;
                    ctx.beginPath();
                    ctx.moveTo(bx + r * 0.08, by);
                    ctx.bezierCurveTo(bx - r * 0.05, by + tSide * r * 0.18, bx - r * 0.18, by + tSide * r * 0.26, bx - r * 0.28, by + tSide * r * 0.30);
                    ctx.lineTo(bx - r * 0.08, by + tSide * r * 0.05);
                    ctx.closePath();
                    ctx.fill();
                }

                ctx.fillStyle = getCachedLinearGradient(ctx, "whip_tip_" + cfg.tipGlow + "_" + cfg.spikeCol, eX, eY - r * 0.3, eX - r * 0.5, eY + r * 0.3, [
                    [0, "#ffffff"],
                    [0.45, cfg.tipGlow],
                    [1, cfg.darkArmor]
                ]);
                ctx.strokeStyle = cfg.veinCol;
                ctx.lineWidth = 1.3;
                ctx.beginPath();
                ctx.moveTo(eX + r * 0.14, eY - tSide * r * 0.08);
                ctx.bezierCurveTo(eX - r * 0.10, eY + tSide * r * 0.35, eX - r * 0.38, eY + tSide * r * 0.32, eX - r * 0.54, eY + tSide * r * 0.14);
                ctx.bezierCurveTo(eX - r * 0.30, eY + tSide * r * 0.04, eX - r * 0.22, eY - tSide * r * 0.16, eX - r * 0.14, eY - tSide * r * 0.30);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            }
        }

        ctx.strokeStyle = cfg.veinCol;
        ctx.lineWidth = 2.0;
        for (let cSide = -1; cSide <= 1; cSide += 2) {
            ctx.beginPath();
            ctx.moveTo(-r * 0.58, cSide * r * 0.18);
            ctx.bezierCurveTo(
                -r * 1.15, cSide * r * 0.32 + wag * 0.35,
                -r * 1.65, -cSide * r * 0.18 + wag * 0.75,
                -r * 2.22, wag
            );
            ctx.stroke();
        }

        const segCount = 6;
        let prevX = -r * 0.58;
        let prevY = 0;

        for (let s = 1; s <= segCount; s++) {
            const t = s / segCount;
            const curX = -r * (0.58 + t * 1.62);
            const curY = Math.sin(e.legPhase * swingSpeed - t * 1.45) * swingAmp * Math.pow(t, 1.15);
            const segW = r * (0.30 * (1 - t * 0.44));

            const dx = curX - prevX;
            const dy = curY - prevY;
            const segAng = Math.atan2(dy, dx);
            const nx = -Math.sin(segAng);
            const ny = Math.cos(segAng);

            const segGrad = getCachedLinearGradient(ctx, "tail_seg_" + cfg.darkArmor + "_" + cfg.plateCol, -r * 2, -r * 0.3, -r * 0.5, r * 0.3, [
                [0, cfg.darkArmor],
                [0.5, cfg.plateCol],
                [1, cfg.darkArmor]
            ]);
            ctx.fillStyle = segGrad;
            ctx.strokeStyle = cfg.veinCol;
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            ctx.moveTo(prevX + nx * segW, prevY + ny * segW);
            ctx.lineTo((prevX + curX) * 0.5 + nx * segW * 1.12, (prevY + curY) * 0.5 + ny * segW * 1.12);
            ctx.lineTo(curX + nx * segW * 0.78, curY + ny * segW * 0.78);
            ctx.lineTo(curX - nx * segW * 0.78, curY - ny * segW * 0.78);
            ctx.lineTo((prevX + curX) * 0.5 - nx * segW * 1.12, (prevY + curY) * 0.5 - ny * segW * 1.12);
            ctx.lineTo(prevX - nx * segW, prevY - ny * segW);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            const barbLen = r * (0.38 - t * 0.10);
            ctx.fillStyle = (s % 2 === 0) ? cfg.spikeCol : cfg.tipGlow;
            ctx.strokeStyle = cfg.darkArmor;
            ctx.lineWidth = 1.1;
            for (let bSide = -1; bSide <= 1; bSide += 2) {
                const bx = (prevX + curX) * 0.5 + nx * bSide * segW * 0.85;
                const by = (prevY + curY) * 0.5 + ny * bSide * segW * 0.85;
                ctx.beginPath();
                ctx.moveTo(bx - dx * 0.32, by - dy * 0.32);
                ctx.bezierCurveTo(
                    bx + nx * bSide * barbLen * 0.55,
                    by + ny * bSide * barbLen * 0.55,
                    bx + dx * 0.35 + nx * bSide * barbLen * 0.92,
                    by + dy * 0.35 + ny * bSide * barbLen * 0.92,
                    bx + dx * 0.65 + nx * bSide * barbLen,
                    by + dy * 0.65 + ny * bSide * barbLen
                );
                ctx.lineTo(bx + dx * 0.28, by + dy * 0.28);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            }

            ctx.fillStyle = cfg.tipGlow;
            ctx.beginPath();
            safeArc(ctx, (prevX + curX) * 0.5, (prevY + curY) * 0.5, Math.max(2.2, segW * 0.36));
            ctx.fill();
            ctx.fillStyle = "#020617";
            ctx.beginPath();
            safeArc(ctx, (prevX + curX) * 0.5, (prevY + curY) * 0.5, Math.max(1.0, segW * 0.16));
            ctx.fill();

            prevX = curX;
            prevY = curY;
        }

        const maceX = prevX - r * 0.18;
        const maceY = prevY;
        const maceR = r * 0.44;
        const maceRot = wag * 0.028 + frameCounter * (isCasting ? 0.11 : 0.035);

        ctx.save();
        ctx.translate(maceX, maceY);
        ctx.rotate(maceRot);

        ctx.fillStyle = getCachedRadialGradient(ctx, "mace_glow_" + cfg.tipGlow + "_" + Math.round(maceR), 0, 0, maceR * 0.2, 0, 0, maceR * 2.2, [
            [0, cfg.tipGlow],
            [0.5, cfg.veinCol],
            [1, "rgba(0,0,0,0)"]
        ]);
        ctx.beginPath();
        safeArc(ctx, 0, 0, maceR * 2.1);
        ctx.fill();

        const numSpikes = 12;
        for (let k = 0; k < numSpikes; k++) {
            const sa = (k / numSpikes) * Math.PI * 2;
            const isMajor = (k % 3 === 0);
            const spLen = isMajor ? (maceR * 2.28) : (maceR * 1.68);
            const baseHalf = isMajor ? 0.25 : 0.17;

            ctx.fillStyle = isMajor ? cfg.spikeCol : cfg.plateCol;
            ctx.strokeStyle = cfg.darkArmor;
            ctx.lineWidth = 1.4;
            ctx.beginPath();
            ctx.moveTo(Math.cos(sa - baseHalf) * (maceR * 0.76), Math.sin(sa - baseHalf) * (maceR * 0.76));
            ctx.bezierCurveTo(
                Math.cos(sa - baseHalf * 0.45) * (spLen * 0.65),
                Math.sin(sa - baseHalf * 0.45) * (spLen * 0.65),
                Math.cos(sa + 0.06) * (spLen * 0.88),
                Math.sin(sa + 0.06) * (spLen * 0.88),
                Math.cos(sa) * spLen,
                Math.sin(sa) * spLen
            );
            ctx.bezierCurveTo(
                Math.cos(sa + baseHalf * 0.5) * (spLen * 0.62),
                Math.sin(sa + baseHalf * 0.5) * (spLen * 0.62),
                Math.cos(sa + baseHalf) * (maceR * 0.82),
                Math.sin(sa + baseHalf) * (maceR * 0.82),
                Math.cos(sa + baseHalf) * (maceR * 0.76),
                Math.sin(sa + baseHalf) * (maceR * 0.76)
            );
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            if (isMajor) {
                ctx.fillStyle = cfg.tipGlow;
                ctx.beginPath();
                ctx.moveTo(Math.cos(sa - 0.11) * (spLen * 0.56), Math.sin(sa - 0.11) * (spLen * 0.56));
                ctx.lineTo(Math.cos(sa) * spLen, Math.sin(sa) * spLen);
                ctx.lineTo(Math.cos(sa + 0.11) * (spLen * 0.56), Math.sin(sa + 0.11) * (spLen * 0.56));
                ctx.closePath();
                ctx.fill();
            }
        }

        ctx.fillStyle = cfg.darkArmor;
        ctx.strokeStyle = cfg.veinCol;
        ctx.lineWidth = 2.6;
        ctx.beginPath();
        for (let k = 0; k < 8; k++) {
            const a = k * (Math.PI * 0.25) + Math.PI * 0.125;
            const px = Math.cos(a) * maceR;
            const py = Math.sin(a) * maceR;
            if (k === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        drawEldritchMechaEye(ctx, 0, 0, maceR * 0.48, cfg.tipGlow, true, -maceRot);

        ctx.restore();
    }


    function drawBossArticulatedSpikedLegs(e, cfg) {
        const r = e.radius;
        for (let side = -1; side <= 1; side += 2) {
            for (let l = 0; l < 4; l++) {
                const offsetRatio = (l - 1.5) * 0.44;
                const stride = Math.sin(e.legPhase + l * 1.48 + (side === 1 ? 0 : Math.PI)) * (r * 0.29);

                const rootX = offsetRatio * r * 0.94;
                const rootY = side * r * 0.48;
                const kneeX = rootX + stride * 0.62 + (l < 2 ? r * 0.12 : -r * 0.14);
                const kneeY = side * (r * 1.25 + (l === 1 || l === 2 ? r * 0.22 : 0));
                const ankleX = kneeX + stride * 0.72 + (l < 2 ? r * 0.24 : -r * 0.22);
                const ankleY = side * (r * 1.62);
                const tipX  = kneeX + stride * 0.88 + (l < 2 ? r * 0.42 : -r * 0.36);
                const tipY  = side * (r * 1.88);

                const fAng = Math.atan2(kneeY - rootY, kneeX - rootX);
                const fnx = -Math.sin(fAng) * Math.max(4.5, r * 0.11);
                const fny = Math.cos(fAng) * Math.max(4.5, r * 0.11);

                ctx.strokeStyle = cfg.spikeCol;
                ctx.lineWidth = Math.max(2.0, r * 0.045);
                ctx.beginPath();
                ctx.moveTo(rootX - fnx * 0.9, rootY - fny * 0.9);
                ctx.lineTo(kneeX - fnx * 0.7, kneeY - fny * 0.7);
                ctx.stroke();

                const femurGrad = getCachedLinearGradient(ctx, "femur_" + cfg.darkArmor + "_" + cfg.plateCol, rootX, rootY, kneeX, kneeY, [
                    [0, cfg.darkArmor],
                    [0.5, cfg.plateCol],
                    [1, cfg.darkArmor]
                ]);
                ctx.fillStyle = femurGrad;
                ctx.strokeStyle = cfg.plateCol;
                ctx.lineWidth = 1.8;
                ctx.beginPath();
                ctx.moveTo(rootX + fnx, rootY + fny);
                ctx.lineTo((rootX + kneeX) * 0.5 + fnx * 1.35, (rootY + kneeY) * 0.5 + fny * 1.35);
                ctx.lineTo(kneeX + fnx * 0.85, kneeY + fny * 0.85);
                ctx.lineTo(kneeX - fnx * 0.85, kneeY - fny * 0.85);
                ctx.lineTo(rootX - fnx * 0.75, rootY - fny * 0.75);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.strokeStyle = cfg.veinCol;
                ctx.lineWidth = 2.0;
                ctx.beginPath();
                ctx.moveTo(rootX, rootY);
                ctx.lineTo(kneeX, kneeY);
                ctx.stroke();

                const bladeGrad = getCachedLinearGradient(ctx, "leg_blade_" + cfg.spikeCol + "_" + cfg.tipGlow, kneeX, kneeY, tipX, tipY, [
                    [0, cfg.darkArmor],
                    [0.45, cfg.spikeCol],
                    [1, cfg.tipGlow]
                ]);
                ctx.fillStyle = bladeGrad;
                ctx.strokeStyle = cfg.darkArmor;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(kneeX - r * 0.11, kneeY);
                ctx.bezierCurveTo(

        const now = performance.now();
        const flash = e.hitFlash > 0;
        const isChilled = isGlobalFrozen || globalFrozenState || e.chillTimer > 0;
        const pulse = 1.0 + Math.sin(now * 0.016 + e.legPhase) * 0.09;

        const abyssBlack  = flash ? "#ffffff" : (isChilled ? "#0c4a6e" : "#0a0106");
        const crimsonHull = flash ? "#ffffff" : (isChilled ? "#0369a1" : "#4c0519");
        const bloodNeon   = flash ? "#ffffff" : "#f43f5e";
        const royalGold   = flash ? "#ffffff" : "#fde047";
        const voidViolet  = flash ? "#ffffff" : "#e879f9";

        ctx.fillStyle = getCachedRadialGradient(ctx, "boss_genesis_aura_" + Math.round(r), 0, 0, r * 0.25, 0, 0, r * 2.15, [
            [0, "rgba(244, 63, 94, 0.54)"],
            [0.52, "rgba(232, 121, 249, 0.28)"],
            [1, "rgba(0, 0, 0, 0)"]
        ]);
        ctx.beginPath();
        safeArc(ctx, 0, 0, r * 2.15);
        ctx.fill();

        const cfg = {
            darkArmor: abyssBlack,
            plateCol: crimsonHull,
            veinCol: bloodNeon,
            spikeCol: royalGold,
            tipGlow: voidViolet,
            hasTwinWhips: true
        };

        drawBossSpikedMorningStarTail(e, cfg);
        drawBossArticulatedSpikedLegs(e, cfg);
        drawBossSerratedPincers(e, cfg);

        ctx.save();
        ctx.rotate(-now * 0.005);
        ctx.strokeStyle = royalGold;
        ctx.lineWidth = 2.2;
        ctx.setLineDash([8, 6, 2, 6]);
        ctx.beginPath();
        safeArc(ctx, 0, 0, r * 1.34);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();

        for (let side = -1; side <= 1; side += 2) {
            ctx.fillStyle = abyssBlack;
            ctx.strokeStyle = bloodNeon;
            ctx.lineWidth = 2.4;
            ctx.beginPath();
            ctx.moveTo(r * 0.44, side * r * 0.48);
            ctx.bezierCurveTo(
                r * 0.28, side * r * 1.25 * pulse,
                r * 0.15, side * r * 1.48 * pulse,
                r * 0.05, side * r * 1.66 * pulse
            );
            ctx.lineTo(-r * 0.35, side * r * 1.05 * pulse);
            ctx.bezierCurveTo(
                -r * 0.55, side * r * 1.32 * pulse,
                -r * 0.78, side * r * 1.42 * pulse,
                -r * 0.98, side * r * 1.48 * pulse
            );
            ctx.lineTo(-r * 0.62, side * r * 0.50);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            drawEldritchMechaEye(ctx, -r * 0.14, side * r * 1.12 * pulse, r * 0.15, royalGold, true);
            drawEldritchMechaEye(ctx, -r * 0.64, side * r * 1.08 * pulse, r * 0.12, voidViolet, true);
        }

        ctx.fillStyle = crimsonHull;
        ctx.strokeStyle = royalGold;
        ctx.lineWidth = 3.2;
        ctx.beginPath();
        ctx.moveTo(r * 1.34, 0);
        ctx.lineTo(r * 0.70, -r * 0.66);
        ctx.lineTo(r * 0.16, -r * 1.12 * pulse);
        ctx.lineTo(-r * 0.48, -r * 0.76);
        ctx.lineTo(-r * 0.94, 0);
        ctx.lineTo(-r * 0.48, r * 0.76);
        ctx.lineTo(r * 0.16, r * 1.12 * pulse);
        ctx.lineTo(r * 0.70, r * 0.66);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        drawExposedMechaRibcage(ctx, r * 0.52, -r * 0.62, r * 0.76, 6, royalGold, bloodNeon, pulse);

        drawEldritchMechaEye(ctx, r * 0.08, 0, r * 0.42 * pulse, bloodNeon, true);

        ctx.fillStyle = royalGold;
        for (let side = -1; side <= 1; side += 2) {
            ctx.beginPath();
            ctx.moveTo(r * 0.55, side * r * 0.35);
            ctx.bezierCurveTo(r * 0.85, side * r * 0.95, r * 1.25, side * r * 0.88, r * 1.56, side * r * 0.42);
            ctx.lineTo(r * 0.82, side * r * 0.48);
            ctx.closePath();
            ctx.fill();

            for (let eIdx = 0; eIdx < 5; eIdx++) {
                drawEldritchMechaEye(ctx, r * (0.94 - eIdx * 0.13), side * r * (0.14 + eIdx * 0.09), 2.6, royalGold, true);
            }
        }

        ctx.restore();
    }



    // =========================================================================
    // PHẦN 5: VÒNG LẶP DI CHUYỂN, TƯƠNG TÁC & VẼ QUÁI (ROAMING & SHOWCASE ENGINE)
    // =========================================================================
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    window.ctx = ctx;

    let W = 0, H = 0;
    function resize() {
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = W;
        canvas.height = H;
    }
    window.addEventListener('resize', resize);
    resize();

    let isPaused = false;

    const btnTogglePause = document.getElementById('btnTogglePause');
    const btnToggleFreeze = document.getElementById('btnToggleFreeze');
    const btnToggleBurn = document.getElementById('btnToggleBurn');
    const btnToggleCast = document.getElementById('btnToggleCast');
    const btnGridShowcase = document.getElementById('btnGridShowcase');

    function syncHudButtons() {
        btnTogglePause.classList.toggle('active', isPaused);
        btnToggleFreeze.classList.toggle('active', globalFrozenState);
        btnToggleBurn.classList.toggle('active', globalBurnState);
        btnToggleCast.classList.toggle('active', globalRageCast);
        btnGridShowcase.classList.toggle('active', showcaseGridMode);
    }

    btnTogglePause.addEventListener('click', () => {
        isPaused = !isPaused;
        syncHudButtons();
    });
    btnToggleFreeze.addEventListener('click', () => {
        globalFrozenState = !globalFrozenState;
        syncHudButtons();
    });
    btnToggleBurn.addEventListener('click', () => {
        globalBurnState = !globalBurnState;
        syncHudButtons();
    });
    btnToggleCast.addEventListener('click', () => {
        globalRageCast = !globalRageCast;
        monsters.forEach(m => { m.skillState = globalRageCast ? "casting" : "idle"; });
        syncHudButtons();
    });
    btnGridShowcase.addEventListener('click', () => {
        showcaseGridMode = !showcaseGridMode;
        syncHudButtons();
    });

    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            e.preventDefault();
            isPaused = !isPaused;
            syncHudButtons();
        }
    });

    let mouse = { x: -1000, y: -1000, down: false };
    window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
    window.addEventListener('mousedown', (e) => {
        if (e.target.tagName === 'BUTTON') return;
        mouse.down = true;
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        monsters.forEach(m => {
            if (Math.hypot(m.x - mouse.x, m.y - mouse.y) < m.radius + 140) {
                m.hitFlash = 8;
            }
        });
    });
    window.addEventListener('mouseup', () => { mouse.down = false; });

    // KHỞI TẠO ĐÚNG 15 LOÀI (Hàng 1: 5 Quái Thường hình thái khác biệt hoàn toàn | Hàng 2 & 3: 10 Boss)
    const MONSTER_SPECIES = [
        // 10 Boss Cuối Màn (Hàng 2 & Hàng 3 khi xếp đội hình 5 cột)
        {
            name: "Boss 1: Omega Behemoth",
            labelColor: "#f43f5e",
            radius: 46,
            speed: 1.25,
            mapId: 1,
            draw: (e) => { window.currentMapId = 1; drawBossOmegaMonsterProcedural(e, globalFrozenState); }
        },
        {
            name: "Boss 2: Void Emperor",
            labelColor: "#c084fc",
            radius: 48,
            speed: 1.3,
            mapId: 2,
            draw: (e) => { window.currentMapId = 2; drawBossOmegaMonsterProcedural(e, globalFrozenState); }
        },
        {
            name: "Boss 3: Cryo Leviathan",
            labelColor: "#38bdf8",
            radius: 50,
            speed: 1.2,
            mapId: 3,
            draw: (e) => { window.currentMapId = 3; drawBossOmegaMonsterProcedural(e, globalFrozenState); }
        },
        {
            name: "Boss 4: Magma Abomination",
            labelColor: "#f97316",
            radius: 50,
            speed: 1.35,
            mapId: 4,
            draw: (e) => drawBossMagmaMonsterProcedural(e, globalFrozenState)
        },
        {
            name: "Boss 5: Hive Empress",
            labelColor: "#d8b4fe",
            radius: 52,
            speed: 1.35,
            mapId: 5,
            draw: (e) => drawBossHiveEmpressProcedural(e, globalFrozenState)
        },
        {
            name: "Boss 6: Singularity Overlord",
            labelColor: "#e879f9",
            radius: 54,
            speed: 1.4,
            mapId: 6,
            draw: (e) => drawBossSingularityOverlordProcedural(e, globalFrozenState)
        },
        {
            name: "Boss 7: Cyber Titan",
            labelColor: "#f59e0b",
            radius: 54,
            speed: 1.3,
            mapId: 7,
            draw: (e) => drawBossCyberTitanProcedural(e, globalFrozenState)
        },
        {
            name: "Boss 8: Abyssal Kraken",
            labelColor: "#2dd4bf",
            radius: 55,
            speed: 1.35,
            mapId: 8,
            draw: (e) => drawBossAbyssalKrakenProcedural(e, globalFrozenState)
        },
        {
            name: "Boss 9: Chrono Warden",
            labelColor: "#fde047",
            radius: 56,
            speed: 1.4,
            mapId: 9,
            draw: (e) => drawBossChronoWardenProcedural(e, globalFrozenState)
        },
        {
            name: "Boss 10: Apex Progenitor",
            labelColor: "#fb7185",
            radius: 58,
            speed: 1.45,
            mapId: 10,
            draw: (e) => drawBossApexProgenitorProcedural(e, globalFrozenState)
        }
    ];

    const monsters = [];
    MONSTER_SPECIES.forEach((sp, idx) => {
        const margin = sp.radius * 2 + 50;
        monsters.push({
            speciesIndex: idx,
            x: margin + Math.random() * (Math.max(300, W - margin * 2)),
            y: margin + Math.random() * (Math.max(300, H - margin * 2)),
            angle: Math.random() * Math.PI * 2,
            targetAngle: Math.random() * Math.PI * 2,
            speed: sp.speed * (0.9 + Math.random() * 0.25),
            radius: sp.radius,
            legPhase: Math.random() * Math.PI * 2,
            turnTimer: Math.random() * 80,

            name: sp.name,
            labelColor: sp.labelColor,
            typeKey: sp.typeKey || "crawler",
            mapId: sp.mapId || 1,
            bodyColor: sp.bodyColor || "#881337",
            carapaceColor: sp.carapaceColor || "#161130",
            eyeColor: sp.eyeColor || "#f43f5e",
            isElite: !!sp.isElite,
            hitFlash: 0,
            chillTimer: 0,
            burnTimer: 0,
            nuclearSlowTimer: 0,
            skillState: "idle",
            skillType: "plasma",
            hp: 100,
            maxHp: 100,
            draw: sp.draw
        });
    });

    let lastTime = performance.now();
    function animate(now) {
        requestAnimationFrame(animate);
        const dt = Math.min(0.1, (now - lastTime) / 1000);
        lastTime = now;
        frameCounter++;

        ctx.clearRect(0, 0, W, H);

        if (!isPaused) {
            monsters.forEach((e, idx) => {
                if (e.hitFlash > 0) e.hitFlash = Math.max(0, e.hitFlash - dt * 30);
                e.legPhase += e.speed * dt * (globalRageCast ? 5.4 : 3.8);

                if (showcaseGridMode) {
                    // Xếp đội hình chuẩn 5 cột x 2 hàng cho 10 Boss:
                    // Hàng 1: Boss 1 -> Boss 5
                    // Hàng 2: Boss 6 -> Boss 10
                    const cols = 5;
                    const rows = Math.ceil(monsters.length / cols);
                    const col = idx % cols;
                    const row = Math.floor(idx / cols);
                    const gx = (W / (cols + 1)) * (col + 1);
                    const gy = 70 + ((H - 125) / Math.max(1, rows)) * (row + 0.48);
                    e.x += (gx - e.x) * Math.min(1, dt * 6);
                    e.y += (gy - e.y) * Math.min(1, dt * 6);
                    const lookMouse = Math.atan2(mouse.y - e.y, mouse.x - e.x);
                    e.angle = Number.isFinite(lookMouse) ? lookMouse : 0;
                    return;
                }

                e.turnTimer -= dt * 60;
                if (e.turnTimer <= 0) {
                    e.targetAngle = e.angle + (Math.random() - 0.5) * 1.8;
                    e.turnTimer = 45 + Math.random() * 90;
                }

                const dxMouse = e.x - mouse.x;
                const dyMouse = e.y - mouse.y;
                const distMouse = Math.hypot(dxMouse, dyMouse);
                if (distMouse < 180) {
                    const fleeAngle = Math.atan2(dyMouse, dxMouse);
                    e.targetAngle = fleeAngle;
                    e.turnTimer = 30;
                }

                const pad = e.radius * 2.2 + 30;
                if (e.x < pad) e.targetAngle = 0;
                else if (e.x > W - pad) e.targetAngle = Math.PI;
                if (e.y < pad + 35) e.targetAngle = Math.PI / 2;
                else if (e.y > H - pad) e.targetAngle = -Math.PI / 2;

                let diff = e.targetAngle - e.angle;
                while (diff < -Math.PI) diff += Math.PI * 2;
                while (diff > Math.PI) diff -= Math.PI * 2;
                e.angle += diff * Math.min(1, dt * 5.5);

                const moveMult = globalFrozenState ? 0.45 : (globalRageCast ? 1.35 : 1.0);
                e.x += Math.cos(e.angle) * e.speed * moveMult * 60 * dt;
                e.y += Math.sin(e.angle) * e.speed * moveMult * 60 * dt;

                e.x = Math.max(pad * 0.7, Math.min(W - pad * 0.7, e.x));
                e.y = Math.max(pad * 0.7 + 30, Math.min(H - pad * 0.7, e.y));
            });
        }

        // VẼ TẤT CẢ QUÁI VẬT & TÊN
        monsters.forEach(e => {
            try {
                e.draw(e);
            } catch (err) {}

            ctx.save();
            ctx.font = "bold 11px 'JetBrains Mono', monospace";
            ctx.textAlign = "center";
            ctx.fillStyle = "rgba(2, 6, 23, 0.78)";
            const textW = ctx.measureText(e.name).width;
            ctx.fillRect(e.x - textW / 2 - 5, e.y - e.radius - 24, textW + 10, 16);
            ctx.strokeStyle = "rgba(148, 163, 184, 0.25)";
            ctx.lineWidth = 1;
            ctx.strokeRect(e.x - textW / 2 - 5, e.y - e.radius - 24, textW + 10, 16);
            ctx.fillStyle = e.labelColor;
            ctx.fillText(e.name, e.x, e.y - e.radius - 12);
            ctx.restore();
        });
    }

    requestAnimationFrame(animate);
    </script>
</body>
</html>
