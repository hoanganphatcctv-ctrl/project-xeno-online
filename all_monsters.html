<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xeno Monsters Roaming - Canvas 2D Pure Code</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #020617;
            font-family: 'JetBrains Mono', 'Consolas', monospace;
            color: #94a3b8;
            user-select: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background-color: #020617;
            background-image: 
                radial-gradient(circle at 50% 50%, #091329 0%, #020617 100%),
                linear-gradient(to right, rgba(6, 182, 212, 0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(6, 182, 212, 0.04) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
        }
        #miniTip {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            padding: 6px 14px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 9999px;
            font-size: 11px;
            color: #38bdf8;
            pointer-events: none;
            backdrop-filter: blur(4px);
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>
    <div id="miniTip">Chuột nhấp để quái dạt ra | Phím Space: Tạm dừng | 15 Loài Quái & Boss đang chạy loăng quăng</div>

    <script>
    // =========================================================================
    // PHẦN 1: CÁC HÀM TRỢ GIÚP CANVAS 2D CƠ BẢN
    // =========================================================================
    let frameCounter = 0;
    const _radialGradCache = new Map();

    function safeArc(c, x, y, r, sAng = 0, eAng = Math.PI * 2) {
        if (!Number.isFinite(x) || !Number.isFinite(y)) return;
        const rad = Number.isFinite(r) ? Math.max(0.5, r) : 1;
        c.arc(x, y, rad, sAng, eAng);
    }

    function safeRadialGradient(c, x0, y0, r0, x1, y1, r1) {
        const rx0 = Number.isFinite(x0) ? x0 : 0;
        const ry0 = Number.isFinite(y0) ? y0 : 0;
        const rr0 = Number.isFinite(r0) ? Math.max(0.01, r0) : 0.01;
        const rx1 = Number.isFinite(x1) ? x1 : 0;
        const ry1 = Number.isFinite(y1) ? y1 : 0;
        const rr1 = Number.isFinite(r1) ? Math.max(rr0 + 0.1, r1) : 10;
        try {
            return c.createRadialGradient(rx0, ry0, rr0, rx1, ry1, rr1);
        } catch (e) {
            return c.createRadialGradient(0, 0, 0.1, 0, 0, 10);
        }
    }

    function getCachedRadialGradient(c, key, x0, y0, r0, x1, y1, r1, stops) {
        let g = _radialGradCache.get(key);
        if (!g) {
            g = safeRadialGradient(c, x0, y0, r0, x1, y1, r1);
            for (let i = 0; i < stops.length; i++) {
                g.addColorStop(stops[i][0], stops[i][1]);
            }
            _radialGradCache.set(key, g);
        }
        return g;
    }


    // =========================================================================
    // PHẦN 2: BỘ PHẬN GIẢI PHẪU DÙNG CHUNG CỦA 10 BOSS
    // 1. Đuôi 5 đốt khớp nối + Quả chùy gai 12 gai xoay tít + Cặp roi điện
    // 2. 8 Chân khớp bọc giáp gai gối nhô cao & vuốt liềm
    // 3. Đôi càng lưỡi hái răng cưa saw-teeth & sừng vai càn quét
    // =========================================================================
        function drawBossSpikedMorningStarTail(e, cfg) {
            const r = e.radius;
            const isCasting = e.skillState && e.skillState !== "idle";
            const swingSpeed = isCasting ? 1.55 : 0.88;
            const swingAmp = isCasting ? (r * 0.54) : (r * 0.38);
            const wag = Math.sin(e.legPhase * swingSpeed) * swingAmp;

            // Optional Twin Auxiliary Barbed Whip-Tendrils flanking the main Morning-Star Tail
            if (cfg.hasTwinWhips) {
                for (let tSide = -1; tSide <= 1; tSide += 2) {
                    const wWag = Math.sin(e.legPhase * 1.05 + (tSide === 1 ? 0.6 : 2.2)) * (r * 0.34);
                    const mX = -r * 1.28, mY = tSide * r * 0.58 + wWag * 0.5;
                    const eX = -r * 1.92, eY = tSide * r * 0.52 + wWag;

                    ctx.strokeStyle = cfg.darkArmor;
                    ctx.lineWidth = Math.max(4.5, r * 0.13);
                    ctx.lineCap = "round";
                    ctx.beginPath();
                    ctx.moveTo(-r * 0.68, tSide * r * 0.32);
                    ctx.lineTo(mX, mY);
                    ctx.lineTo(eX, eY);
                    ctx.stroke();

                    ctx.strokeStyle = cfg.veinCol;
                    ctx.lineWidth = 1.6;
                    ctx.stroke();

                    // Whip vertebra barb
                    ctx.fillStyle = cfg.spikeCol;
                    ctx.beginPath();
                    ctx.moveTo(mX, mY);
                    ctx.lineTo(mX - r * 0.22, mY + tSide * r * 0.28);
                    ctx.lineTo(mX + r * 0.10, mY + tSide * r * 0.06);
                    ctx.closePath();
                    ctx.fill();

                    // Crescent razor blade at whip tip
                    ctx.fillStyle = cfg.tipGlow;
                    ctx.beginPath();
                    ctx.moveTo(eX + r * 0.14, eY - tSide * r * 0.10);
                    ctx.lineTo(eX - r * 0.42, eY + tSide * r * 0.20);
                    ctx.lineTo(eX - r * 0.12, eY - tSide * r * 0.24);
                    ctx.closePath();
                    ctx.fill();
                }
            }

            // 5 Articulated Armored Vertebrae Segments leading to the Colossal Morning-Star Mace
            const segCount = 5;
            let prevX = -r * 0.62;
            let prevY = 0;

            for (let s = 1; s <= segCount; s++) {
                const t = s / segCount;
                const curX = -r * (0.62 + t * 1.56);
                const curY = Math.sin(e.legPhase * swingSpeed - t * 1.35) * swingAmp * Math.pow(t, 1.15);
                const segW = r * (0.28 * (1 - t * 0.42));

                // Armored Hexagonal Vertebra Segment
                const dx = curX - prevX;
                const dy = curY - prevY;
                const segAng = Math.atan2(dy, dx);
                const nx = -Math.sin(segAng);
                const ny = Math.cos(segAng);

                ctx.fillStyle = cfg.darkArmor;
                ctx.strokeStyle = cfg.plateCol;
                ctx.lineWidth = 1.8;
                ctx.beginPath();
                ctx.moveTo(prevX + nx * segW, prevY + ny * segW);
                ctx.lineTo(curX + nx * segW * 0.82, curY + ny * segW * 0.82);
                ctx.lineTo(curX - nx * segW * 0.82, curY - ny * segW * 0.82);
                ctx.lineTo(prevX - nx * segW, prevY - ny * segW);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Lateral Razor Barbs on each tail vertebra
                const barbLen = r * (0.34 - t * 0.08);
                ctx.fillStyle = (s % 2 === 0) ? cfg.spikeCol : cfg.tipGlow;
                for (let bSide = -1; bSide <= 1; bSide += 2) {
                    const bx = (prevX + curX) * 0.5 + nx * bSide * segW * 0.85;
                    const by = (prevY + curY) * 0.5 + ny * bSide * segW * 0.85;
                    ctx.beginPath();
                    ctx.moveTo(bx - dx * 0.25, by - dy * 0.25);
                    ctx.lineTo(bx + dx * 0.45 + nx * bSide * barbLen, by + dy * 0.45 + ny * bSide * barbLen);
                    ctx.lineTo(bx + dx * 0.22, by + dy * 0.22);
                    ctx.closePath();
                    ctx.fill();
                }

                // Glowing dorsal conduit node on vertebra
                ctx.fillStyle = cfg.veinCol;
                ctx.beginPath();
                safeArc(ctx, (prevX + curX) * 0.5, (prevY + curY) * 0.5, Math.max(2.2, segW * 0.34));
                ctx.fill();

                prevX = curX;
                prevY = curY;
            }

            // COLOSSAL 12-SPIKED MORNING-STAR TAIL MACE HEAD (QUẢ CHÙY GAI KHỔNG LỒ 3A)
            const maceX = prevX - r * 0.16;
            const maceY = prevY;
            const maceR = r * 0.42;
            const maceRot = wag * 0.025 + (isCasting ? frameCounter * 0.12 : 0);

            ctx.save();
            ctx.translate(maceX, maceY);
            ctx.rotate(maceRot);

            // 1. 12 Radiating Two-Tone Executioner Spikes around the Morning-Star Mace
            const numSpikes = 12;
            for (let k = 0; k < numSpikes; k++) {
                const sa = (k / numSpikes) * Math.PI * 2;
                const isMajor = (k % 3 === 0);
                const spLen = isMajor ? (maceR * 2.15) : (maceR * 1.62);
                const baseHalf = isMajor ? 0.24 : 0.17;

                // Outer Spike Body
                ctx.fillStyle = isMajor ? cfg.spikeCol : cfg.plateCol;
                ctx.strokeStyle = cfg.darkArmor;
                ctx.lineWidth = 1.4;
                ctx.beginPath();
                ctx.moveTo(Math.cos(sa - baseHalf) * (maceR * 0.78), Math.sin(sa - baseHalf) * (maceR * 0.78));
                ctx.lineTo(Math.cos(sa) * spLen, Math.sin(sa) * spLen);
                ctx.lineTo(Math.cos(sa + baseHalf) * (maceR * 0.78), Math.sin(sa + baseHalf) * (maceR * 0.78));
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Glowing Hot/Energy Tip on Major Spikes
                if (isMajor) {
                    ctx.fillStyle = cfg.tipGlow;
                    ctx.beginPath();
                    ctx.moveTo(Math.cos(sa - 0.11) * (spLen * 0.58), Math.sin(sa - 0.11) * (spLen * 0.58));
                    ctx.lineTo(Math.cos(sa) * spLen, Math.sin(sa) * spLen);
                    ctx.lineTo(Math.cos(sa + 0.11) * (spLen * 0.58), Math.sin(sa + 0.11) * (spLen * 0.58));
                    ctx.closePath();
                    ctx.fill();
                }
            }

            // 2. Heavy Faceted Octagonal Armored Mace Core
            ctx.fillStyle = cfg.darkArmor;
            ctx.strokeStyle = cfg.veinCol;
            ctx.lineWidth = 2.6;
            ctx.beginPath();
            for (let k = 0; k < 8; k++) {
                const a = k * (Math.PI * 0.25) + Math.PI * 0.125;
                const px = Math.cos(a) * maceR;
                const py = Math.sin(a) * maceR;
                if (k === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // 3. Inner Cross-Braced Cage & Pulsing Energy Core of the Morning-Star
            ctx.fillStyle = cfg.tipGlow;
            ctx.beginPath();
            for (let k = 0; k < 4; k++) {
                const a = k * (Math.PI * 0.5);
                const rad = (k % 2 === 0) ? maceR * 0.68 : maceR * 0.52;
                ctx.moveTo(0, 0);
                ctx.lineTo(Math.cos(a - 0.22) * (maceR * 0.35), Math.sin(a - 0.22) * (maceR * 0.35));
                ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
                ctx.lineTo(Math.cos(a + 0.22) * (maceR * 0.35), Math.sin(a + 0.22) * (maceR * 0.35));
            }
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            safeArc(ctx, 0, 0, maceR * 0.26);
            ctx.fill();

            ctx.restore();
        }


        function drawBossArticulatedSpikedLegs(e, cfg) {
            const r = e.radius;
            for (let side = -1; side <= 1; side += 2) {
                for (let l = 0; l < 4; l++) {
                    const offsetRatio = (l - 1.5) * 0.44;
                    const stride = Math.sin(e.legPhase + l * 1.48 + (side === 1 ? 0 : Math.PI)) * (r * 0.28);

                    const rootX = offsetRatio * r * 0.94;
                    const rootY = side * r * 0.48;
                    const kneeX = rootX + stride * 0.62 + (l < 2 ? r * 0.10 : -r * 0.12);
                    const kneeY = side * (r * 1.22 + (l === 1 || l === 2 ? r * 0.20 : 0));
                    const tipX  = kneeX + stride * 0.84 + (l < 2 ? r * 0.34 : -r * 0.30);
                    const tipY  = side * (r * 1.78);

                    // 1. Armored Polygonal Femur Plate
                    const fAng = Math.atan2(kneeY - rootY, kneeX - rootX);
                    const fnx = -Math.sin(fAng) * 5.2;
                    const fny = Math.cos(fAng) * 5.2;

                    ctx.fillStyle = cfg.darkArmor;
                    ctx.strokeStyle = cfg.plateCol;
                    ctx.lineWidth = 1.8;
                    ctx.beginPath();
                    ctx.moveTo(rootX + fnx, rootY + fny);
                    ctx.lineTo(kneeX + fnx * 0.85, kneeY + fny * 0.85);
                    ctx.lineTo(kneeX - fnx * 0.85, kneeY - fny * 0.85);
                    ctx.lineTo(rootX - fnx, rootY - fny);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();

                    // Glowing femur power conduit
                    ctx.strokeStyle = cfg.veinCol;
                    ctx.lineWidth = 2.0;
                    ctx.beginPath();
                    ctx.moveTo(rootX, rootY);
                    ctx.lineTo(kneeX, kneeY);
                    ctx.stroke();

                    // 2. Serrated Scythe Tibia & Razor Blade Tarsus
                    ctx.fillStyle = cfg.spikeCol;
                    ctx.strokeStyle = cfg.darkArmor;
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(kneeX - r * 0.11, kneeY);
                    ctx.lineTo( (kneeX + tipX) * 0.5 + (l < 2 ? r * 0.12 : -r * 0.10), (kneeY + tipY) * 0.5 + side * r * 0.08 );
                    ctx.lineTo(tipX, tipY);
                    ctx.lineTo(kneeX + r * 0.12, kneeY - side * r * 0.09);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();

                    // Glowing Razor Claw Tip
                    ctx.fillStyle = cfg.tipGlow;
                    ctx.beginPath();
                    ctx.moveTo(tipX, tipY);
                    ctx.lineTo(tipX - (l < 2 ? r * 0.14 : -r * 0.14), tipY - side * r * 0.18);
                    ctx.lineTo(tipX - (l < 2 ? r * 0.04 : -r * 0.04), tipY - side * r * 0.22);
                    ctx.closePath();
                    ctx.fill();

                    // 3. Large Protruding Knee-Horn Spur
                    ctx.fillStyle = cfg.tipGlow;
                    ctx.strokeStyle = cfg.darkArmor;
                    ctx.lineWidth = 1.2;
                    ctx.beginPath();
                    ctx.moveTo(kneeX - r * 0.10, kneeY);
                    ctx.lineTo(kneeX + (l < 2 ? -r * 0.24 : r * 0.22), kneeY + side * r * 0.34);
                    ctx.lineTo(kneeX + r * 0.11, kneeY);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                }
            }
        }


        function drawBossSerratedPincers(e, cfg) {
            const r = e.radius;
            const snap = Math.sin(e.legPhase * 1.18) * 0.20;
            const reach = r * 1.76;

            for (let side = -1; side <= 1; side += 2) {
                // Forward-Curving Siege Shoulder Horn
                ctx.fillStyle = cfg.spikeCol;
                ctx.strokeStyle = cfg.darkArmor;
                ctx.lineWidth = 1.8;
                ctx.beginPath();
                ctx.moveTo(r * 0.14, side * r * 0.68);
                ctx.quadraticCurveTo(r * 0.78, side * r * 1.22, r * 1.38, side * r * 0.72);
                ctx.quadraticCurveTo(r * 0.74, side * r * 0.86, r * 0.34, side * r * 0.48);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Colossal Serrated Executioner Scythe-Pincer with 3 Inner Saw-Teeth
                ctx.save();
                ctx.translate(r * 0.48, side * r * 0.54);
                ctx.rotate(side * (0.28 - snap));

                ctx.fillStyle = cfg.darkArmor;
                ctx.strokeStyle = cfg.veinCol;
                ctx.lineWidth = 2.2;
                ctx.beginPath();
                ctx.moveTo(0, -side * r * 0.12);
                ctx.lineTo(reach * 0.38, side * r * 0.48);
                ctx.lineTo(reach * 0.78, side * r * 0.36);
                ctx.lineTo(reach * 1.04, -side * r * 0.14);
                // Serrated inner saw-teeth
                ctx.lineTo(reach * 0.76, -side * r * 0.02);
                ctx.lineTo(reach * 0.66, side * r * 0.16);
                ctx.lineTo(reach * 0.54, -side * r * 0.06);
                ctx.lineTo(reach * 0.44, side * r * 0.14);
                ctx.lineTo(reach * 0.30, -side * r * 0.10);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Glowing Razor Cutting Edge along Pincer Tip
                ctx.fillStyle = cfg.tipGlow;
                ctx.beginPath();
                ctx.moveTo(reach * 0.62, side * r * 0.26);
                ctx.lineTo(reach * 0.78, side * r * 0.36);
                ctx.lineTo(reach * 1.04, -side * r * 0.14);
                ctx.lineTo(reach * 0.76, -side * r * 0.02);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }
        }



    // =========================================================================
    // PHẦN 3: 5 LOÀI QUÁI THƯỜNG (CRAWLER, STALKER, BRUTE, SPITTER, PRAETORIAN)
    // =========================================================================
        function drawXenomorphMonsterProcedural(e, isGlobalFrozen) {
            const r = Math.max(8, e.radius || 14);
            const isChilled = isGlobalFrozen || e.chillTimer > 0;
            const flash = e.hitFlash > 0;

            ctx.save();
            ctx.translate(e.x, e.y);

            // 2.5D Ground Contact Shadow under every Xenomorph
            ctx.fillStyle = "rgba(2, 6, 18, 0.52)";
            ctx.beginPath();
            safeArc(ctx, 0, 3, r * 1.08);
            ctx.fill();

            // Radioactive Green Slow Ring if poisoned by Nuclear Pool
            if (e.nuclearSlowTimer > 0) {
                ctx.strokeStyle = "rgba(74, 222, 128, 0.75)";
                ctx.lineWidth = 2.0;
                ctx.beginPath();
                safeArc(ctx, 0, 0, r * 1.28);
                ctx.stroke();
            }

            ctx.rotate(e.angle);

            const shellCol = flash ? "#ffffff" : (isChilled ? "#0369a1" : e.carapaceColor);
            const fleshCol = flash ? "#ffffff" : (isChilled ? "#0284c7" : e.bodyColor);
            const clawCol  = flash ? "#ffffff" : (isChilled ? "#bae6fd" : (e.isElite ? "#4ade80" : "#e2e8f0"));
            const spikeCol = flash ? "#ffffff" : (isChilled ? "#7dd3fc" : (e.isElite ? "#d8b4fe" : "#fca5a5"));

            // =========================================================================
            // 1. CRAWLER XENO (QUÁI BÒ SÁT GAI ĐỘC - SPINED VENOM SWARMER)
            // =========================================================================
            if (e.typeKey === "crawler") {
                const venomCol = flash ? "#ffffff" : (isChilled ? "#7dd3fc" : "#4ade80");
                const bloodTip = flash ? "#ffffff" : (isChilled ? "#bae6fd" : "#ef4444");
                const darkArmor = flash ? "#ffffff" : (isChilled ? "#0c4a6e" : "#052e16");
                const tailWag = Math.sin(e.legPhase * 0.95) * (r * 0.42);

                // Segmented Scorpion Whip-Tail with Barbs & Venom Stinger
                const t1x = -r * 0.85, t1y = tailWag * 0.25;
                const t2x = -r * 1.38, t2y = tailWag * 0.65;
                const t3x = -r * 1.92, t3y = tailWag;
                ctx.strokeStyle = darkArmor;
                ctx.lineWidth = Math.max(2.6, r * 0.24);
                ctx.lineCap = "round";
                ctx.beginPath();
                ctx.moveTo(-r * 0.45, 0);
                ctx.lineTo(t1x, t1y);
                ctx.lineTo(t2x, t2y);
                ctx.lineTo(t3x, t3y);
                ctx.stroke();

                // Lateral Tail Spikes along segments
                ctx.fillStyle = spikeCol;
                for (let s = -1; s <= 1; s += 2) {
                    ctx.beginPath();
                    ctx.moveTo(t1x, t1y);
                    ctx.lineTo(t1x - r * 0.22, t1y + s * r * 0.34);
                    ctx.lineTo(t1x + r * 0.12, t1y + s * r * 0.08);
                    ctx.closePath();
                    ctx.fill();

                    ctx.beginPath();
                    ctx.moveTo(t2x, t2y);
                    ctx.lineTo(t2x - r * 0.20, t2y + s * r * 0.28);
                    ctx.lineTo(t2x + r * 0.10, t2y + s * r * 0.06);
                    ctx.closePath();
                    ctx.fill();
                }

                // Glowing Barbed Scorpion Stinger Tip
                ctx.fillStyle = bloodTip;
                ctx.beginPath();
                ctx.moveTo(t3x - r * 0.42, t3y + tailWag * 0.18);
                ctx.lineTo(t3x + r * 0.08, t3y - r * 0.18);
                ctx.lineTo(t3x - r * 0.06, t3y);
                ctx.lineTo(t3x + r * 0.08, t3y + r * 0.18);
                ctx.closePath();
                ctx.fill();

                // 3 Pairs of Razor-Spined Arachnid Legs (Femur + Knee Spur + Blade Tarsus)
                for (let side = -1; side <= 1; side += 2) {
                    for (let l = 0; l < 3; l++) {
                        const offsetRatio = (l - 1) * 0.52;
                        const stride = Math.sin(e.legPhase + l * 1.65 + (side === 1 ? 0 : Math.PI)) * (r * 0.32);

                        const rootX = offsetRatio * r * 0.85;
                        const rootY = side * r * 0.36;
                        const kneeX = rootX + stride * 0.6 + (l === 0 ? r * 0.18 : (l === 2 ? -r * 0.18 : 0));
                        const kneeY = side * (r * 1.15 + (l === 1 ? r * 0.18 : 0));
                        const tipX  = kneeX + stride * 0.85 + (l === 0 ? r * 0.38 : -r * 0.28);
                        const tipY  = side * (r * 1.68);

                        // Armored Femur
                        ctx.strokeStyle = darkArmor;
                        ctx.lineWidth = Math.max(2.4, r * 0.20);
                        ctx.beginPath();
                        ctx.moveTo(rootX, rootY);
                        ctx.lineTo(kneeX, kneeY);
                        ctx.stroke();

                        // Sharp Blade Tarsus
                        ctx.fillStyle = clawCol;
                        ctx.beginPath();
                        ctx.moveTo(kneeX - r * 0.09, kneeY);
                        ctx.lineTo(tipX, tipY);
                        ctx.lineTo(kneeX + r * 0.11, kneeY - side * r * 0.08);
                        ctx.closePath();
                        ctx.fill();

                        // Protruding Knee Thorn
                        ctx.fillStyle = spikeCol;
                        ctx.beginPath();
                        ctx.moveTo(kneeX, kneeY);
                        ctx.lineTo(kneeX + r * 0.16, kneeY + side * r * 0.28);
                        ctx.lineTo(kneeX - r * 0.10, kneeY + side * r * 0.06);
                        ctx.closePath();
                        ctx.fill();
                    }
                }

                // Dual Serrated Mantis Scythe-Claws with Inner Saw-Teeth
                const pinch = Math.sin(e.legPhase * 1.25) * 0.22;
                const clawReach = r * 1.48;
                for (let side = -1; side <= 1; side += 2) {
                    ctx.save();
                    ctx.translate(r * 0.42, side * r * 0.45);
                    ctx.rotate(side * (0.36 - pinch));

                    // Main Scythe Blade
                    ctx.fillStyle = clawCol;
                    ctx.strokeStyle = darkArmor;
                    ctx.lineWidth = 1.2;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(clawReach * 0.45, side * r * 0.36);
                    ctx.lineTo(clawReach * 1.05, -side * r * 0.12);
                    ctx.lineTo(clawReach * 0.72, -side * r * 0.02);

            const pulse = 1.0 + Math.sin(now * 0.014 + e.legPhase) * 0.09;

            const deepHull  = flash ? "#ffffff" : (isChilled ? "#0c4a6e" : "#021824");
            const krakenShell = flash ? "#ffffff" : (isChilled ? "#0369a1" : "#0f4c5c");
            const aquaGlow  = flash ? "#ffffff" : "#2dd4bf";
            const bioCyan   = flash ? "#ffffff" : "#38bdf8";
            const coralSpike = flash ? "#ffffff" : "#f43f5e";

            ctx.fillStyle = getCachedRadialGradient(ctx, "boss_abyss_aura_" + r, 0, 0, r * 0.25, 0, 0, r * 1.95, [
                [0, "rgba(45, 212, 191, 0.44)"],
                [0.55, "rgba(56, 189, 248, 0.20)"],
                [1, "rgba(0, 0, 0, 0)"]
            ]);
            ctx.beginPath();
            safeArc(ctx, 0, 0, r * 1.95);
            ctx.fill();

            const cfg = {
                darkArmor: deepHull,
                plateCol: krakenShell,
                veinCol: aquaGlow,
                spikeCol: coralSpike,
                tipGlow: bioCyan,
                hasTwinWhips: true
            };

            drawBossSpikedMorningStarTail(e, cfg);
            drawBossArticulatedSpikedLegs(e, cfg);
            drawBossSerratedPincers(e, cfg);

            // Bioluminescent Hydro-Fins
            for (let side = -1; side <= 1; side += 2) {
                ctx.fillStyle = deepHull;
                ctx.strokeStyle = aquaGlow;
                ctx.lineWidth = 2.2;
                ctx.beginPath();
                ctx.moveTo(r * 0.38, side * r * 0.45);
                ctx.lineTo(-r * 0.15, side * r * 1.48 * pulse);
                ctx.lineTo(-r * 0.78, side * r * 0.92 * pulse);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            }

            ctx.fillStyle = krakenShell;
            ctx.strokeStyle = bioCyan;
            ctx.lineWidth = 3.0;
            ctx.beginPath();
            ctx.moveTo(r * 1.24, 0);
            ctx.lineTo(r * 0.58, -r * 0.72);
            ctx.lineTo(-r * 0.48, -r * 0.82);
            ctx.lineTo(-r * 0.95, 0);
            ctx.lineTo(-r * 0.48, r * 0.82);
            ctx.lineTo(r * 0.58, r * 0.72);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = aquaGlow;
            ctx.beginPath();
            safeArc(ctx, r * 0.05, 0, r * 0.34 * pulse);
            ctx.fill();
            ctx.restore();
        }


    // BOSS MAP 9: CHRONO WARDEN (GIÁM NGỤC KHÔNG-THỜI GIAN)
        function drawBossChronoWardenProcedural(e, isGlobalFrozen) {
            ctx.save();
            ctx.translate(e.x, e.y);
            ctx.rotate(e.angle);

            const r = e.radius;
            const now = performance.now();
            const flash = e.hitFlash > 0;
            const isChilled = isGlobalFrozen || e.chillTimer > 0;
            const pulse = 1.0 + Math.sin(now * 0.015 + e.legPhase) * 0.08;

            const darkObsidian = flash ? "#ffffff" : (isChilled ? "#0c4a6e" : "#120b24");
            const royalViolet  = flash ? "#ffffff" : (isChilled ? "#0369a1" : "#3b0764");
            const chronoGold   = flash ? "#ffffff" : "#fde047";
            const riftPurple   = flash ? "#ffffff" : "#e879f9";

            ctx.fillStyle = getCachedRadialGradient(ctx, "boss_chrono_aura_" + r, 0, 0, r * 0.25, 0, 0, r * 1.98, [
                [0, "rgba(250, 204, 21, 0.44)"],
                [0.55, "rgba(192, 132, 252, 0.24)"],
                [1, "rgba(0, 0, 0, 0)"]
            ]);
            ctx.beginPath();
            safeArc(ctx, 0, 0, r * 1.98);
            ctx.fill();

            const cfg = {
                darkArmor: darkObsidian,
                plateCol: royalViolet,
                veinCol: chronoGold,
                spikeCol: chronoGold,
                tipGlow: riftPurple,
                hasTwinWhips: true
            };

            drawBossSpikedMorningStarTail(e, cfg);
            drawBossArticulatedSpikedLegs(e, cfg);
            drawBossSerratedPincers(e, cfg);

            // Rotating Golden Temporal Halo on Back
            ctx.save();
            ctx.rotate(now * 0.004);
            ctx.strokeStyle = chronoGold;
            ctx.lineWidth = 2.4;
            ctx.setLineDash([10, 6]);
            ctx.beginPath();
            safeArc(ctx, 0, 0, r * 1.18);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.restore();

            ctx.fillStyle = royalViolet;
            ctx.strokeStyle = chronoGold;
            ctx.lineWidth = 3.0;
            ctx.beginPath();
            ctx.moveTo(r * 1.25, 0);
            ctx.lineTo(r * 0.62, -r * 0.68);
            ctx.lineTo(-r * 0.42, -r * 0.88);
            ctx.lineTo(-r * 0.90, 0);
            ctx.lineTo(-r * 0.42, r * 0.88);
            ctx.lineTo(r * 0.62, r * 0.68);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = chronoGold;
            ctx.beginPath();
            safeArc(ctx, r * 0.08, 0, r * 0.34 * pulse);
            ctx.fill();
            ctx.restore();
        }


    // BOSS MAP 10: APEX PROGENITOR (THỦY TỔ XENOMORPH TỐI THƯỢNG)
        function drawBossApexProgenitorProcedural(e, isGlobalFrozen) {
            ctx.save();
            ctx.translate(e.x, e.y);
            ctx.rotate(e.angle);

            const r = e.radius;
            const now = performance.now();
            const flash = e.hitFlash > 0;
            const isChilled = isGlobalFrozen || e.chillTimer > 0;
            const pulse = 1.0 + Math.sin(now * 0.016 + e.legPhase) * 0.09;

            const abyssBlack  = flash ? "#ffffff" : (isChilled ? "#0c4a6e" : "#0f0208");
            const crimsonHull = flash ? "#ffffff" : (isChilled ? "#0369a1" : "#4c0519");
            const bloodNeon   = flash ? "#ffffff" : "#f43f5e";
            const royalGold   = flash ? "#ffffff" : "#fde047";
            const voidViolet  = flash ? "#ffffff" : "#e879f9";

            ctx.fillStyle = getCachedRadialGradient(ctx, "boss_genesis_aura_" + r, 0, 0, r * 0.25, 0, 0, r * 2.05, [
                [0, "rgba(244, 63, 94, 0.50)"],
                [0.52, "rgba(232, 121, 249, 0.26)"],
                [1, "rgba(0, 0, 0, 0)"]
            ]);
            ctx.beginPath();
            safeArc(ctx, 0, 0, r * 2.05);
            ctx.fill();

            const cfg = {
                darkArmor: abyssBlack,
                plateCol: crimsonHull,
                veinCol: bloodNeon,
                spikeCol: royalGold,
                tipGlow: voidViolet,
                hasTwinWhips: true
            };

            drawBossSpikedMorningStarTail(e, cfg);
            drawBossArticulatedSpikedLegs(e, cfg);
            drawBossSerratedPincers(e, cfg);

            // 4 Swept Progenitor Sovereign Wings
            for (let side = -1; side <= 1; side += 2) {
                ctx.fillStyle = abyssBlack;
                ctx.strokeStyle = bloodNeon;
                ctx.lineWidth = 2.4;
                ctx.beginPath();
                ctx.moveTo(r * 0.42, side * r * 0.48);
                ctx.lineTo(r * 0.05, side * r * 1.56 * pulse);
                ctx.lineTo(-r * 0.35, side * r * 1.02 * pulse);
                ctx.lineTo(-r * 0.92, side * r * 1.40 * pulse);
                ctx.lineTo(-r * 0.58, side * r * 0.50);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            }

            ctx.fillStyle = crimsonHull;
            ctx.strokeStyle = royalGold;
            ctx.lineWidth = 3.2;
            ctx.beginPath();
            ctx.moveTo(r * 1.30, 0);
            ctx.lineTo(r * 0.68, -r * 0.64);
            ctx.lineTo(r * 0.16, -r * 1.08 * pulse);
            ctx.lineTo(-r * 0.45, -r * 0.72);
            ctx.lineTo(-r * 0.88, 0);
            ctx.lineTo(-r * 0.45, r * 0.72);
            ctx.lineTo(r * 0.16, r * 1.08 * pulse);
            ctx.lineTo(r * 0.68, r * 0.64);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Apex Genesis Singularity Heart
            ctx.fillStyle = bloodNeon;
            ctx.beginPath();
            safeArc(ctx, r * 0.08, 0, r * 0.40 * pulse);
            ctx.fill();
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            safeArc(ctx, r * 0.08, 0, r * 0.18);
            ctx.fill();
            ctx.restore();
        }



    // =========================================================================
    // PHẦN 5: VÒNG LẶP DI CHUYỂN & VẼ QUÁI CHẠY LOĂNG QUĂNG (ROAMING ENGINE)
    // =========================================================================
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    window.ctx = ctx; // Gán vào window.ctx cho toàn bộ các hàm vẽ procedural phía trên!

    let W = 0, H = 0;
    function resize() {
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = W;
        canvas.height = H;
    }
    window.addEventListener('resize', resize);
    resize();

    let isPaused = false;
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') isPaused = !isPaused;
    });

    // Tương tác chuột: quái né ra khi di chuột hoặc click
    let mouse = { x: -1000, y: -1000, down: false };
    window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
    window.addEventListener('mousedown', (e) => { mouse.down = true; mouse.x = e.clientX; mouse.y = e.clientY; });
    window.addEventListener('mouseup', () => { mouse.down = false; });

    // KHỞI TẠO TẤT CẢ 15 LOÀI QUÁI VẬT & BOSS CHẠY TRÊN MÀN HÌNH
    const MONSTER_SPECIES = [
        // 5 Quái thường
        {
            name: "Crawler Xeno",
            labelColor: "#4ade80",
            radius: 14,
            speed: 2.1,
            typeKey: "crawler",
            bodyColor: "#16a34a",
            carapaceColor: "#064e3b",
            eyeColor: "#ef4444",
            draw: (e) => drawXenomorphMonsterProcedural(e, false)
        },
        {
            name: "Razor Stalker",
            labelColor: "#2dd4bf",
            radius: 16,
            speed: 2.4,
            typeKey: "stalker",
            bodyColor: "#0d9488",
            carapaceColor: "#134e4a",
            eyeColor: "#fde047",
            draw: (e) => drawXenomorphMonsterProcedural(e, false)
        },
        {
            name: "Acid Spitter",
            labelColor: "#a3e635",
            radius: 17,
            speed: 1.8,
            typeKey: "spitter",
            bodyColor: "#65a30d",
            carapaceColor: "#365314",
            eyeColor: "#bef264",
            draw: (e) => drawXenomorphMonsterProcedural(e, false)
        },
        {
            name: "Brood Brute",
            labelColor: "#fb923c",
            radius: 24,
            speed: 1.4,
            typeKey: "brute",
            bodyColor: "#dc2626",
            carapaceColor: "#450a0a",
            eyeColor: "#38bdf8",
            draw: (e) => drawXenomorphMonsterProcedural(e, false)
        },
        {
            name: "Xeno Praetorian",
            labelColor: "#c084fc",
            radius: 23,
            speed: 2.2,
            typeKey: "praetorian",
            isElite: true,
            bodyColor: "#9333ea",
            carapaceColor: "#3b0764",
            eyeColor: "#4ade80",
            draw: (e) => drawXenomorphMonsterProcedural(e, false)
        },

        // 10 Boss Cuối Màn
        {
            name: "Boss 1: Omega Behemoth",
            labelColor: "#f43f5e",
            radius: 46,
            speed: 1.25,
            mapId: 1,
            draw: (e) => { window.currentMapId = 1; drawBossOmegaMonsterProcedural(e, false); }
        },
        {
            name: "Boss 2: Void Emperor",
            labelColor: "#c084fc",
            radius: 48,
            speed: 1.3,
            mapId: 2,
            draw: (e) => { window.currentMapId = 2; drawBossOmegaMonsterProcedural(e, false); }
        },
        {
            name: "Boss 3: Cryo Leviathan",
            labelColor: "#38bdf8",
            radius: 50,
            speed: 1.2,
            mapId: 3,
            draw: (e) => { window.currentMapId = 3; drawBossOmegaMonsterProcedural(e, false); }
        },
        {
            name: "Boss 4: Magma Abomination",
            labelColor: "#f97316",
            radius: 50,
            speed: 1.35,
            mapId: 4,
            draw: (e) => drawBossMagmaMonsterProcedural(e, false)
        },
        {
            name: "Boss 5: Hive Empress",
            labelColor: "#d8b4fe",
            radius: 52,
            speed: 1.35,
            mapId: 5,
            draw: (e) => drawBossHiveEmpressProcedural(e, false)
        },
        {
            name: "Boss 6: Singularity Overlord",
            labelColor: "#e879f9",
            radius: 54,
            speed: 1.4,
            mapId: 6,
            draw: (e) => drawBossSingularityOverlordProcedural(e, false)
        },
        {
            name: "Boss 7: Cyber Titan",
            labelColor: "#f59e0b",
            radius: 54,
            speed: 1.3,
            mapId: 7,
            draw: (e) => drawBossCyberTitanProcedural(e, false)
        },
        {
            name: "Boss 8: Abyssal Kraken",
            labelColor: "#2dd4bf",
            radius: 55,
            speed: 1.35,
            mapId: 8,
            draw: (e) => drawBossAbyssalKrakenProcedural(e, false)
        },
        {
            name: "Boss 9: Chrono Warden",
            labelColor: "#fde047",
            radius: 56,
            speed: 1.4,
            mapId: 9,
            draw: (e) => drawBossChronoWardenProcedural(e, false)
        },
        {
            name: "Boss 10: Apex Progenitor",
            labelColor: "#fb7185",
            radius: 58,
            speed: 1.45,
            mapId: 10,
            draw: (e) => drawBossApexProgenitorProcedural(e, false)
        }
    ];

    // Tạo các thực thể quái đang chạy trên màn hình (thêm bản sao của các quái nhỏ để sinh động)
    const monsters = [];
    MONSTER_SPECIES.forEach((sp, idx) => {
        // Với quái thường: tạo 2 con mỗi loại; với boss: tạo 1 con
        const count = (idx < 3) ? 2 : 1;
        for (let i = 0; i < count; i++) {
            const margin = sp.radius * 2 + 50;
            monsters.push({
                x: margin + Math.random() * (Math.max(300, W - margin * 2)),
                y: margin + Math.random() * (Math.max(300, H - margin * 2)),
                angle: Math.random() * Math.PI * 2,
                targetAngle: Math.random() * Math.PI * 2,
                speed: sp.speed * (0.9 + Math.random() * 0.25),
                radius: sp.radius,
                legPhase: Math.random() * Math.PI * 2,
                turnTimer: Math.random() * 80,
                
                // Thuộc tính tương thích vẽ procedural
                name: sp.name,
                labelColor: sp.labelColor,
                typeKey: sp.typeKey || "crawler",
                mapId: sp.mapId || 1,
                bodyColor: sp.bodyColor || "#881337",
                carapaceColor: sp.carapaceColor || "#161130",
                eyeColor: sp.eyeColor || "#f43f5e",
                isElite: !!sp.isElite,
                hitFlash: 0,
                chillTimer: 0,
                burnTimer: 0,
                nuclearSlowTimer: 0,
                skillState: "idle",
                skillType: "flame",
                hp: 100,
                maxHp: 100,
                draw: sp.draw
            });
        }
    });

    // VÒNG LẶP RENDER & CẬP NHẬT CHUYỂN ĐỘNG
    let lastTime = performance.now();
    function animate(now) {
        requestAnimationFrame(animate);
        const dt = Math.min(0.1, (now - lastTime) / 1000);
        lastTime = now;
        frameCounter++;

        ctx.clearRect(0, 0, W, H);

        if (!isPaused) {
            monsters.forEach(e => {
                // 1. Chu kỳ bước chân
                e.legPhase += e.speed * dt * 3.8;

                // 2. Chuyển hướng ngẫu nhiên định kỳ
                e.turnTimer -= dt * 60;
                if (e.turnTimer <= 0) {
                    e.targetAngle = e.angle + (Math.random() - 0.5) * 1.8;
                    e.turnTimer = 45 + Math.random() * 90;
                }

                // 3. Tránh né chuột khi click hoặc di gần
                const dxMouse = e.x - mouse.x;
                const dyMouse = e.y - mouse.y;
                const distMouse = Math.hypot(dxMouse, dyMouse);
                if (distMouse < 180) {
                    const fleeAngle = Math.atan2(dyMouse, dxMouse);
                    e.targetAngle = fleeAngle;
                    e.turnTimer = 30;
                }

                // 4. Quay đầu mượt mà khi chạm mép màn hình
                const pad = e.radius * 2.2 + 30;
                if (e.x < pad) e.targetAngle = 0;
                else if (e.x > W - pad) e.targetAngle = Math.PI;
                if (e.y < pad) e.targetAngle = Math.PI / 2;
                else if (e.y > H - pad) e.targetAngle = -Math.PI / 2;

                // 5. Nội suy góc quay
                let diff = e.targetAngle - e.angle;
                while (diff < -Math.PI) diff += Math.PI * 2;
                while (diff > Math.PI) diff -= Math.PI * 2;
                e.angle += diff * Math.min(1, dt * 5.5);

                // 6. Cập nhật vị trí
                e.x += Math.cos(e.angle) * e.speed * 60 * dt;
                e.y += Math.sin(e.angle) * e.speed * 60 * dt;

                // Khóa cứng không cho lọt ra ngoài màn hình
                e.x = Math.max(pad * 0.7, Math.min(W - pad * 0.7, e.x));
                e.y = Math.max(pad * 0.7, Math.min(H - pad * 0.7, e.y));
            });
        }

        // VẼ TẤT CẢ QUÁI VẬT & TÊN
        monsters.forEach(e => {
            // Vẽ quái
            try {
                e.draw(e);
            } catch (err) {}

            // Nhãn tên tối giản phía trên đầu quái
            ctx.save();
            ctx.font = "bold 11px monospace";
            ctx.textAlign = "center";
            ctx.fillStyle = "rgba(2, 6, 23, 0.75)";
            const textW = ctx.measureText(e.name).width;
            ctx.fillRect(e.x - textW / 2 - 4, e.y - e.radius - 23, textW + 8, 16);
            ctx.fillStyle = e.labelColor;
            ctx.fillText(e.name, e.x, e.y - e.radius - 11);
            ctx.restore();
        });
    }

    requestAnimationFrame(animate);
    </script>
